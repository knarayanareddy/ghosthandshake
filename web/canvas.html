<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AFTERIMAGE — Ghost Handshake</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #0E151C; color: #D5DDE4; overflow: hidden;
      font-family: Fraunces, Georgia, serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; left: 1.2rem; bottom: 1.2rem;
      font-family: "IBM Plex Mono", monospace; font-size: 0.78rem;
      letter-spacing: 0.04em; pointer-events: none;
    }
    #hud b { font-family: Fraunces, serif; font-size: 1.35rem; font-weight: 400; display: block; margin-bottom: 0.2rem; }
    input {
      position: fixed; top: 0.8rem; right: 0.8rem; width: 22rem; max-width: 70vw;
      background: transparent; border: 0; border-bottom: 1px solid #4A5A68;
      color: #8A9AAB; font-family: "IBM Plex Mono", monospace; font-size: 0.7rem;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud"><b>Afterimage</b><span id="meta">waiting for bonds…</span></div>
  <input id="addr" placeholder="GhostHandshake 0x…" />
  <script type="module">
    import { JsonRpcProvider, Contract, keccak256, solidityPacked } from "https://esm.sh/ethers@6.13.4";

    const ABI = [
      "function getAllPairs() view returns (tuple(address a, address b, bytes32 wordHash, uint64 matchedAtBlock)[])",
      "event Matched(address indexed a, address indexed b, bytes32 wordHash, uint256 pairIndex, uint64 atBlock)",
    ];
    const RPC = "https://testnet-rpc.monad.xyz";

    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const drawn = new Set();
    let gh;

    function resize() {
      canvas.width = innerWidth * devicePixelRatio;
      canvas.height = innerHeight * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      drawn.clear();
      paintBg();
    }
    function paintBg() {
      ctx.fillStyle = "#0E151C";
      ctx.fillRect(0, 0, innerWidth, innerHeight);
    }
    window.addEventListener("resize", () => { resize(); refresh(true); });
    resize();

    function seedBytes(p) {
      return keccak256(solidityPacked(["address", "address", "bytes32", "uint64"], [p.a, p.b, p.wordHash, p.matchedAtBlock]));
    }
    function u32(hex, i) {
      return parseInt(hex.slice(2 + i * 8, 10 + i * 8), 16);
    }

    function glyph(p) {
      const h = seedBytes(p);
      const x1 = (u32(h, 0) % (innerWidth - 80)) + 40;
      const y1 = (u32(h, 1) % (innerHeight - 80)) + 40;
      const x2 = (u32(h, 2) % (innerWidth - 80)) + 40;
      const y2 = (u32(h, 3) % (innerHeight - 80)) + 40;
      const phos = `hsla(${160 + (u32(h, 4) % 40)}, 28%, ${35 + (u32(h, 5) % 20)}%, 0.85)`;
      const rust = `hsla(${18 + (u32(h, 6) % 16)}, 55%, 48%, 0.9)`;

      ctx.strokeStyle = phos;
      ctx.lineWidth = 1.25;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      const mx = (x1 + x2) / 2 + ((u32(h, 7) % 80) - 40);
      const my = (y1 + y2) / 2 + ((u32(h, 0) % 80) - 40);
      ctx.quadraticCurveTo(mx, my, x2, y2);
      ctx.stroke();

      for (const [x, y, col] of [[x1, y1, phos], [x2, y2, rust]]) {
        ctx.fillStyle = col;
        ctx.fillRect(x - 4, y - 4, 8, 8);
      }
    }

    async function refresh(force) {
      if (!gh) return;
      try {
        const pairs = await gh.getAllPairs();
        if (force) { drawn.clear(); paintBg(); }
        for (let i = 0; i < pairs.length; i++) {
          if (drawn.has(i) && !force) continue;
          glyph(pairs[i]);
          drawn.add(i);
        }
        const n = pairs.length;
        document.getElementById("meta").textContent =
          n === 0 ? "waiting for bonds…" : `${n * 2} strangers, ${n} bonds.`;
      } catch (e) {
        document.getElementById("meta").textContent = e.shortMessage || e.message;
      }
    }

    function wire(addr) {
      const provider = new JsonRpcProvider(RPC);
      gh = new Contract(addr, ABI, provider);
      localStorage.setItem("gh_addr", addr);
      refresh(true);
      setInterval(() => refresh(false), 4000);
    }

    function contractFromQuery() {
      const q = new URLSearchParams(location.search).get("c");
      return (q && q.startsWith("0x") && q.length === 42) ? q : "";
    }
    const saved = contractFromQuery() || localStorage.getItem("gh_addr");
    const inp = document.getElementById("addr");
    if (saved) { inp.value = saved; wire(saved); }
    inp.addEventListener("change", () => { if (inp.value.trim()) wire(inp.value.trim()); });
  </script>
</body>
</html>
